services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfmtp
      POSTGRES_USER: sfmtp
      POSTGRES_PASSWORD: sfmtp
    ports:
      - "5432:5432"
    volumes:
      - sfmtp_postgres_data:/var/lib/postgresql/data

volumes:
  sfmtp_postgres_data:
