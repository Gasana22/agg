# Store builds for the internal testing tracks (docs/10, Phase 11).
# Run by hand from the Actions tab. Needs, as repository secrets:
#   Android: ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_KEYSTORE_PASSWORD,
#            ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD,
#            PLAY_SERVICE_ACCOUNT_JSON
#   iOS:     IOS_DIST_CERT_P12_BASE64, IOS_DIST_CERT_PASSWORD,
#            IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID,
#            APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#            APP_STORE_CONNECT_KEY_P8
# and the variables SFMTP_API_URL (the production API, ending in /api/v1) and,
# for push, SFMTP_FIREBASE_PROJECT_ID, SFMTP_FIREBASE_SENDER_ID,
# SFMTP_FIREBASE_API_KEY, SFMTP_FIREBASE_ANDROID_APP_ID and
# SFMTP_FIREBASE_IOS_APP_ID (without them the app gets notifications on sync).
name: SFMTP mobile release

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which stores
        type: choice
        options: [both, android, ios]
        default: both
      play_status:
        description: Play release status (draft until the app's first review is done)
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

env:
  DART_DEFINES: >-
    --dart-define=SFMTP_API_URL=${{ vars.SFMTP_API_URL }}
    --dart-define=SFMTP_FIREBASE_PROJECT_ID=${{ vars.SFMTP_FIREBASE_PROJECT_ID }}
    --dart-define=SFMTP_FIREBASE_SENDER_ID=${{ vars.SFMTP_FIREBASE_SENDER_ID }}
    --dart-define=SFMTP_FIREBASE_API_KEY=${{ vars.SFMTP_FIREBASE_API_KEY }}
    --dart-define=SFMTP_FIREBASE_ANDROID_APP_ID=${{ vars.SFMTP_FIREBASE_ANDROID_APP_ID }}
    --dart-define=SFMTP_FIREBASE_IOS_APP_ID=${{ vars.SFMTP_FIREBASE_IOS_APP_ID }}

jobs:
  android:
    name: Google Play internal testing
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Upload key
        working-directory: sfmtp/mobile/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "ANDROID_UPLOAD_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE" | base64 -d > app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > key.properties
      - name: Test and build the app bundle
        working-directory: sfmtp/mobile
        run: |
          flutter pub get
          flutter test
          test -n "${{ vars.SFMTP_API_URL }}" || { echo "Set the SFMTP_API_URL variable"; exit 1; }
          flutter build appbundle --release --build-number ${{ github.run_number }} $DART_DEFINES
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.sfmtp.sfmtp_mobile
          releaseFiles: sfmtp/mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ inputs.play_status }}
      - uses: actions/upload-artifact@v4
        with:
          name: sfmtp-android-bundle
          path: sfmtp/mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Remove the key
        if: always()
        run: rm -f sfmtp/mobile/android/app/upload.jks sfmtp/mobile/android/key.properties

  ios:
    name: TestFlight (internal testers)
    if: inputs.platforms != 'android'
    runs-on: macos-latest
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Signing certificate and profile
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$CERT" || { echo "IOS_DIST_CERT_P12_BASE64 is not set"; exit 1; }
          KEYCHAIN=$RUNNER_TEMP/sfmtp.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > "$RUNNER_TEMP/sfmtp.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/sfmtp.mobileprovision" | plutil -extract UUID raw -)
          cp "$RUNNER_TEMP/sfmtp.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
      - name: Build the IPA
        working-directory: sfmtp/mobile
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>app.sfmtp.sfmtpMobile</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          PLIST
          flutter pub get
          flutter build ipa --release --build-number ${{ github.run_number }} $DART_DEFINES \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
      - name: Upload to TestFlight
        working-directory: sfmtp/mobile
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sfmtp.keychain-db" || true
          rm -rf ~/.appstoreconnect/private_keys "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/sfmtp.mobileprovision"
