name: SFMTP CI

on:
  push:
    paths: ["sfmtp/**", ".github/workflows/sfmtp-ci.yml"]
  pull_request:
    paths: ["sfmtp/**", ".github/workflows/sfmtp-ci.yml"]

concurrency:
  group: sfmtp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: PHP ${{ matrix.php }} · MySQL 8
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.4"]
    defaults:
      run:
        working-directory: sfmtp
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sfmtp
          MYSQL_USER: sfmtp
          MYSQL_PASSWORD: secret
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, openssl, mbstring, curl
          coverage: none

      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Import the database (schema, demo data, triggers)
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1"
          mysql -h 127.0.0.1 -usfmtp -psecret sfmtp < database/sfmtp.sql
          mysql -h 127.0.0.1 -usfmtp -psecret sfmtp < database/sfmtp-triggers.sql

      - name: Configure
        run: |
          sed -e "s/'user' => 'root'/'user' => 'sfmtp'/" \
              -e "s/'password' => ''/'password' => 'secret'/" \
              -e "s#'app_url' => 'http://localhost/sfmtp'#'app_url' => 'http://127.0.0.1:8090'#" \
              -e "s/change-me-to-a-long-random-string/$(openssl rand -hex 32)/" \
              -e "s/'debug' => false/'debug' => true/" \
              config.sample.php > config.php
          grep -q "'user' => 'sfmtp'" config.php

      - name: Smoke test
        run: |
          php -S 127.0.0.1:8090 > server.log 2>&1 &
          sleep 1
          php tests/smoke.php http://127.0.0.1:8090

      - name: Server log
        if: failure()
        run: cat server.log
