name: SFMTP CI

on:
  push:
    paths: ["sfmtp/**", ".github/workflows/sfmtp-ci.yml"]
  pull_request:
    paths: ["sfmtp/**", ".github/workflows/sfmtp-ci.yml"]

concurrency:
  group: sfmtp-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-pgsql:
    name: API · PostgreSQL 16
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfmtp/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: sfmtp_test
      DB_USERNAME: sfmtp
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_mysql, intl, redis, pcntl, posix
          coverage: none
      - name: Create the non-superuser app role (RLS does not apply to superusers)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE sfmtp LOGIN PASSWORD 'secret' NOSUPERUSER"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sfmtp_test OWNER sfmtp"
          psql -h 127.0.0.1 -U postgres -d sfmtp_test -c "ALTER SCHEMA public OWNER TO sfmtp"
      - uses: actions/cache@v4
        with:
          path: sfmtp/backend/vendor
          key: composer-${{ hashFiles('sfmtp/backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style
        run: vendor/bin/pint --test
      - name: Tests
        run: php artisan test

  backend-mysql:
    name: API · MySQL 8
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfmtp/backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sfmtp_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_DATABASE: sfmtp_test
      # root: creating triggers with binary logging on needs SUPER.
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_mysql, intl, redis, pcntl, posix
          coverage: none
      - uses: actions/cache@v4
        with:
          path: sfmtp/backend/vendor
          key: composer-${{ hashFiles('sfmtp/backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests
        run: php artisan test

  contract:
    name: API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint OpenAPI
        working-directory: sfmtp/packages/api-contracts
        run: npx --yes @redocly/cli@2 lint openapi.yaml
      - name: Generated web types are up to date
        working-directory: sfmtp/web
        run: |
          npm ci --no-audit --no-fund
          npm run api:types
          git diff --exit-code -- src/lib/api/schema.d.ts

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sfmtp/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sfmtp/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  mobile:
    name: Mobile (Flutter)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: sfmtp
      DB_USERNAME: sfmtp
      DB_PASSWORD: secret
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: sfmtp/mobile
        run: flutter pub get
      - name: Analyze
        working-directory: sfmtp/mobile
        run: flutter analyze
      - name: Generated database code is up to date
        working-directory: sfmtp/mobile
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - name: Unit and widget tests
        working-directory: sfmtp/mobile
        run: flutter test
      # The offline scenario (docs/08 §6) against the real API with the demo farm.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl
          coverage: none
      - name: Database role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -c "CREATE ROLE sfmtp LOGIN PASSWORD 'secret' NOSUPERUSER"
          psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE sfmtp OWNER sfmtp"
          psql -h 127.0.0.1 -U postgres -d sfmtp -c "ALTER SCHEMA public OWNER TO sfmtp"
      - uses: actions/cache@v4
        with:
          path: sfmtp/backend/vendor
          key: composer-${{ hashFiles('sfmtp/backend/composer.lock') }}
      - name: Start the API with the demo data
        working-directory: sfmtp/backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env && php artisan key:generate
          php artisan migrate --seed --force
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/up && break; sleep 1; done
      - name: Offline scenario against the live API
        working-directory: sfmtp/mobile
        env:
          SFMTP_LIVE_API: http://127.0.0.1:8000/api/v1
        run: flutter test test/live_api_test.dart
      - name: API log
        if: failure()
        run: tail -100 /tmp/api.log; tail -100 sfmtp/backend/storage/logs/laravel.log || true

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend-pgsql, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: sfmtp
          file: sfmtp/infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: sfmtp
          file: sfmtp/infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
