          application/json:
            schema: { $ref: '#/components/schemas/CatalogEntry' }
      responses:
        '201': { $ref: '#/components/responses/CatalogEntry' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/catalog/{catalog}/{id}:
    patch:
      tags: [Catalog]
      operationId: adminUpdateCatalogEntry
      summary: Update an entry (codes and unit factors are permanent; set is_active false to retire)
      x-capability: catalog.manage
      parameters:
        - $ref: '#/components/parameters/Catalog'
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogEntry' }
      responses:
        '200': { $ref: '#/components/responses/CatalogEntry' }
        '422': { $ref: '#/components/responses/Problem' }

  /support/tickets:
    get:
      tags: [Support]
      operationId: listMyTickets
      summary: My tickets, plus all tickets of organizations I own
