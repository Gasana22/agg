      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sold_on]
              properties:
                sold_on: { type: string, format: date }
                sale_price: { type: [number, 'null'] }
                buyer: { type: [string, 'null'] }
                withdrawal_override_reason: { type: [string, 'null'], maxLength: 500 }
      responses:
        '200':
          description: 'Updated'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AnimalSaleRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

