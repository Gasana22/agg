          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pregnant, not_pregnant, aborted] }
                on: { type: [string, 'null'], format: date }
                note: { type: [string, 'null'] }
      responses:
        '200':
          description: 'Updated'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Breeding' }
        '409': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/animal-breedings/{breeding}/birth:
    parameters:
      - $ref: '#/components/parameters/Farm'
      - { name: breeding, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Livestock]
      operationId: recordBirth
      summary: 'Record a birth and register the offspring'
      x-permission: livestock.records.record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [born_on, offspring]
              properties:
                born_on: { type: string, format: date }
                offspring:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [sex]
                    properties:
                      sex: { type: string, enum: [female, male] }
                      name: { type: [string, 'null'] }
                      tag_number: { type: [string, 'null'] }
                note: { type: [string, 'null'] }
      responses:
        '201':
          description: Delivered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Breeding' }
                  meta:
                    type: object
                    properties:
                      offspring: { type: array, items: { $ref: '#/components/schemas/Animal' } }
        '409': { $ref: '#/components/responses/Problem' }

