        - { name: 'filter[user_id]', in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }

  /admin/system/failed-jobs:
    get:
      tags: [Admin]
      operationId: adminFailedJobs
      summary: Recent failed queue jobs
      x-capability: system.view
      responses:
        '200':
          description: Up to 100 failed jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        queue: { type: string }
                        job: { type: [string, 'null'] }
                        error: { type: string }
                        failed_at: { type: string, format: date-time }

  /admin/system/backups:
    get:
      tags: [Admin]
      operationId: adminBackups
      summary: Recent backup runs
      x-capability: system.view
      responses:
        '200':
          description: Backup runs, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BackupRun' } }

  /admin/plans:
    get:
      tags: [Billing]
      operationId: adminListPlans
      summary: All plans, including inactive and non-public
      x-capability: plans.manage
      responses:
        '200': { $ref: '#/components/responses/PlanList' }
    post:
      tags: [Billing]
      operationId: adminCreatePlan
      summary: Create a plan
      x-capability: plans.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '201': { $ref: '#/components/responses/Plan' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/plans/{plan}:
    patch:
      tags: [Billing]
