    parameters:
      - $ref: '#/components/parameters/Farm'
      - $ref: '#/components/parameters/Batch'
    get:
      tags: [Traceability]
      operationId: listBatchEvents
      summary: List batch events
      x-permission: trace.batches.view
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Event timeline in occurred_at order
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TraceEvent' }
    post:
      tags: [Traceability]
      operationId: recordBatchEvent
      summary: Record batch event
      x-permission: trace.events.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_type]
              properties:
                event_type: { type: string, enum: [note, inspection, certification, storage_check] }
                occurred_at: { type: string, format: date-time }
                payload: { type: object, additionalProperties: true }
                location: { $ref: '#/components/schemas/Location' }
      responses:
        '201':
          description: Event appended
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TraceEvent' }
        '422': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/traceability/batches/{batch}/journey:
    get:
      tags: [Traceability]
      operationId: getBatchJourney
      summary: Get batch journey
      x-permission: trace.batches.view
      parameters:
        - $ref: '#/components/parameters/Farm'
        - $ref: '#/components/parameters/Batch'
        - { name: direction, in: query, schema: { type: string, enum: [backward, forward, both], default: both } }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
      responses:
        '200':
          description: Upstream and/or downstream graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      batch: { $ref: '#/components/schemas/Batch' }
                      backward: { oneOf: [{ $ref: '#/components/schemas/Graph' }, { type: 'null' }] }
                      forward: { oneOf: [{ $ref: '#/components/schemas/Graph' }, { type: 'null' }] }
                      evidence_summary:
                        type: object
                        properties:
                          events: { type: integer }
                          gps_points: { type: integer }

