                note: { type: string }
      responses:
        '200':
          description: 'Updated'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AnimalSaleRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/animal-sales/{sale}/complete:
    parameters:
      - $ref: '#/components/parameters/Farm'
      - { name: sale, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Livestock]
      operationId: completeAnimalSale
      summary: 'Record the sale'
      description: 'Marks the animal sold and closes its trace batch (no price in the trace history). Inside a meat withdrawal period: 422 withdrawal_period unless an override reason is given.'
