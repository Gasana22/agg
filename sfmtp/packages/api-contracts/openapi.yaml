      requestBody: { $ref: '#/components/requestBodies/ChangePlan' }
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '422': { $ref: '#/components/responses/Problem' }

  /billing/subscription/cancel:
    post:
      tags: [Billing]
      operationId: cancelMySubscription
      summary: Cancel at the end of the current period
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Subscription' }

  /billing/subscription/resume:
    post:
      tags: [Billing]
      operationId: resumeMySubscription
      summary: Withdraw a scheduled cancellation
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '409': { $ref: '#/components/responses/Problem' }

  /catalog/{catalog}:
    get:
      tags: [Catalog]
