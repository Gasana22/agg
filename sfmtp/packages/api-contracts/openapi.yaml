      tags: [Traceability]
      operationId: changeBatchStatus
      summary: Change batch status
      x-permission: trace.batches.create
      parameters:
        - $ref: '#/components/parameters/Farm'
        - $ref: '#/components/parameters/Batch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, reason]
              properties:
                status: { $ref: '#/components/schemas/BatchStatus' }
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Status changed (recorded as a `status_changed` event)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Batch' }
        '409': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/traceability/events/{event}/corrections:
    post:
      tags: [Traceability]
      operationId: correctEvent
      x-permission: trace.events.create
      summary: Correct an event by appending a `correction` event
      parameters:
        - $ref: '#/components/parameters/Farm'
        - { name: event, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload, reason]
              properties:
                payload: { type: object, additionalProperties: true }
                reason: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Correction event
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TraceEvent' }

  /admin/dashboard:
    get:
      tags: [Admin]
      operationId: getAdminDashboard
      summary: Platform dashboard (platform admins only; trimmed to the caller's capabilities)
      x-capability: dashboard.view
      responses:
        '200':
          description: Platform KPIs; never farm operational data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Dashboard' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/farms:
    get:
      tags: [Admin]
      operationId: adminListFarms
      summary: List farms (metadata only)
      x-capability: farms.view
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [pending, active, suspended, closed] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Farms
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AdminFarm' } }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/farms/{farm}:
    get:
      tags: [Admin]
      operationId: adminGetFarm
      summary: Farm metadata with status history
      x-capability: farms.view
      parameters: [{ $ref: '#/components/parameters/Farm' }]
      responses:
        '200': { $ref: '#/components/responses/AdminFarm' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/farms/{farm}/approve:
    post:
      tags: [Admin]
      operationId: adminApproveFarm
      summary: Approve a pending farm
      x-capability: farms.approve
      parameters: [{ $ref: '#/components/parameters/Farm' }]
      responses:
        '200': { $ref: '#/components/responses/AdminFarm' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/farms/{farm}/suspend:
    post:
      tags: [Admin]
      operationId: adminSuspendFarm
      summary: Suspend a farm (billing staff only for non_payment)
      x-capability: farms.suspend
      parameters: [{ $ref: '#/components/parameters/Farm' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code: { type: string, enum: [non_payment, policy_violation, security, owner_request, other] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/AdminFarm' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/farms/{farm}/unsuspend:
    post:
      tags: [Admin]
      operationId: adminUnsuspendFarm
      summary: Lift a suspension (back to active, or pending if never approved)
      x-capability: farms.suspend
      parameters: [{ $ref: '#/components/parameters/Farm' }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 1000 }
      responses:
        '200': { $ref: '#/components/responses/AdminFarm' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/farms/{farm}/reset-owner-password:
    post:
      tags: [Admin]
      operationId: adminResetOwnerPassword
      summary: Email the farm owner a password-reset link
      x-capability: farms.reset_owner_password
      parameters: [{ $ref: '#/components/parameters/Farm' }]
      responses:
        '202': { description: 'Link sent. The admin never sees or sets the password.' }

  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: List user accounts
      x-capability: users.view
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - { name: 'filter[user_type]', in: query, schema: { type: string, enum: [platform_admin, member, party] } }
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [active, disabled] } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
    post:
      tags: [Admin]
      operationId: adminInviteStaff
      summary: Invite a platform staff member (they set a password via email)
      x-capability: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, platform_roles]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                platform_roles: { type: array, items: { $ref: '#/components/schemas/PlatformRole' } }
      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminUser' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/users/{user}:
    patch:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: Enable/disable an account or change a staff member's platform roles
      x-capability: users.manage
      parameters:
        - { name: user, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, disabled] }
                platform_roles: { type: array, items: { $ref: '#/components/schemas/PlatformRole' } }
      responses:
        '200':
          description: Updated (disabling signs the user out everywhere)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Problem' }

  /admin/settings:
    get:
      tags: [Admin]
      operationId: adminGetSettings
      summary: Platform settings with defaults
      x-capability: settings.manage
      responses:
        '200': { $ref: '#/components/responses/Settings' }
    put:
      tags: [Admin]
      operationId: adminUpdateSettings
      summary: Update platform settings (validated per key)
      x-capability: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/integrations:
    get:
      tags: [Admin]
      operationId: adminListIntegrations
      summary: Integration providers (secrets masked)
      x-capability: integrations.manage
      responses:
        '200':
          description: Providers, and the allowed providers per kind in meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Integration' } }
                  meta:
                    type: object
                    properties:
                      providers: { type: object, additionalProperties: { type: array, items: { type: string } } }
    post:
      tags: [Admin]
      operationId: adminCreateIntegration
      summary: Configure a provider
      x-capability: integrations.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, provider, name]
              properties:
                kind: { $ref: '#/components/schemas/IntegrationKind' }
                provider: { type: string }
                name: { type: string }
                config: { type: object, additionalProperties: { type: [string, 'null'] } }
                is_enabled: { type: boolean }
                is_default: { type: boolean }
      responses:
        '201': { $ref: '#/components/responses/Integration' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/integrations/{integration}:
    parameters:
      - { name: integration, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Admin]
      operationId: adminUpdateIntegration
      summary: Update a provider (masked values keep the stored secret; null removes a key)
      x-capability: integrations.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                config: { type: object, additionalProperties: { type: [string, 'null'] } }
                is_enabled: { type: boolean }
                is_default: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/Integration' }
    delete:
      tags: [Admin]
      operationId: adminDeleteIntegration
      summary: Remove a provider configuration
      x-capability: integrations.manage
      responses:
        '204': { description: 'Removed' }

  /admin/system/health:
    get:
      tags: [Admin]
