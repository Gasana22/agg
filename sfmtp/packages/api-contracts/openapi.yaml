      summary: Add a parent → this batch edge (cycles are refused)
      parameters:
        - $ref: '#/components/parameters/Farm'
        - $ref: '#/components/parameters/Batch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
