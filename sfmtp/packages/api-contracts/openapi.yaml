        format: uuid
    get:
      tags:
      - Procurement
      operationId: getPurchaseRequest
      summary: A purchase request
      x-permission: procurement.requests.create | procurement.requests.approve | procurement.orders.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseRequest'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-requests/{purchaseRequest}/approve:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: purchaseRequest
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: approvePurchaseRequest
      summary: Approve a purchase request
      description: Not your own (unless the owner).
      x-permission: procurement.requests.approve
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
