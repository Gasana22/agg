      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
        - { name: 'filter[status]', in: query, schema: { $ref: '#/components/schemas/SubscriptionStatus' } }
        - { name: 'filter[expiring_within_days]', in: query, schema: { type: integer, minimum: 0 } }
