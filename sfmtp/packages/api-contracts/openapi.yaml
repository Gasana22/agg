          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-requests/{purchaseRequest}:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: purchaseRequest
      in: path
      required: true
      schema:
