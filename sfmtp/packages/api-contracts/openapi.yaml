      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseRequest'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-requests/{purchaseRequest}/reject:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: purchaseRequest
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: rejectPurchaseRequest
      summary: Reject a purchase request
      x-permission: procurement.requests.approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - note
              properties:
                note:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseRequest'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-requests/{purchaseRequest}/cancel:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: purchaseRequest
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: cancelPurchaseRequest
      summary: Cancel a purchase request
      description: Before it is ordered.
      x-permission: procurement.requests.create | procurement.requests.approve
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseRequest'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders:
    parameters:
    - $ref: '#/components/parameters/Farm'
    get:
      tags:
      - Procurement
      operationId: listPurchaseOrders
      summary: Purchase orders
      description: The store sees orders without prices. Prices need procurement.orders.manage or finance.values.view.
      x-permission: procurement.orders.manage | procurement.orders.approve | procurement.deliveries.receive
      parameters:
      - name: filter[status]
        in: query
        schema:
          type: string
          description: Comma-separated statuses
      - name: filter[supplier_id]
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
    post:
      tags:
      - Procurement
      operationId: createPurchaseOrder
      summary: Raise a purchase order
      description: From an approved purchase request (which becomes `ordered`) or directly. Starts as a draft.
      x-permission: procurement.orders.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders/{order}:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Procurement
      operationId: getPurchaseOrder
      summary: A purchase order with deliveries and invoices
      description: Prices need procurement.orders.manage or finance.values.view. Invoices are listed only with price access.
      x-permission: procurement.orders.manage | procurement.orders.approve | procurement.deliveries.receive
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - Procurement
      operationId: updatePurchaseOrder
      summary: Change a draft order
      description: Drafts only; send `version`. Sending `lines` replaces them.
      x-permission: procurement.orders.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseOrderInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders/{order}/approve:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: approvePurchaseOrder
      summary: Approve an order
      description: Not by its author (unless the owner). Above the farm's `approval_thresholds.purchase_order`, only the owner.
      x-permission: procurement.orders.approve
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders/{order}/send:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: sendPurchaseOrder
      summary: Mark as sent to the supplier
      description: From approved.
      x-permission: procurement.orders.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders/{order}/close:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: closePurchaseOrder
      summary: Close an order
      description: 'Short-close: nothing more will be received. Orders close by themselves when fully received and invoiced.'
      x-permission: procurement.orders.manage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders/{order}/cancel:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: cancelPurchaseOrder
      summary: Cancel an order
      description: Only before anything was received.
      x-permission: procurement.orders.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders/{order}/deliveries:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: receiveDelivery
      summary: Receive a delivery (goods received note)
      description: 'From sent, approved or partially received orders; no more than is outstanding. Each line becomes a stock lot (an input_lot trace batch naming the supplier and order) valued at the order price: Dr Inventory / Cr Goods received not invoiced.'
      x-permission: procurement.deliveries.receive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - location_id
              - lines
              properties:
                location_id:
                  type: string
                  format: uuid
                received_on:
                  type: string
                  format: date
                supplier_reference:
                  type:
                  - string
                  - 'null'
                media_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  description: A photo of the delivery note
                note:
                  type:
                  - string
                  - 'null'
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - order_line_id
                    - quantity
                    properties:
                      order_line_id:
                        type: string
                        format: uuid
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                      lot_number:
                        type:
                        - string
                        - 'null'
                      expires_on:
                        type:
                        - string
                        - 'null'
                        format: date
      responses:
        '201':
          description: Received; the updated order
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PurchaseOrder'
                  meta:
                    type: object
                    properties:
                      delivery:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          code:
                            type: string
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/purchase-orders/{order}/invoices:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: order
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Procurement
      operationId: recordSupplierInvoice
      summary: Record the supplier's invoice
      description: 'Three-way match: no more than received and not yet invoiced. Dr Goods received not invoiced at the order price, the difference to Price variance (5200), Cr Accounts payable. The same invoice number from the same supplier is 409.'
      x-permission: procurement.orders.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - invoice_number
              - invoice_date
              - lines
              properties:
                invoice_number:
                  type: string
                  maxLength: 60
                invoice_date:
                  type: string
                  format: date
                due_on:
                  type:
                  - string
                  - 'null'
                  format: date
                  description: Defaults to the supplier's payment terms
                notes:
                  type:
                  - string
                  - 'null'
                lines:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                    - order_line_id
                    - quantity
                    - unit_price
                    properties:
                      order_line_id:
                        type: string
                        format: uuid
                      quantity:
                        type: number
                        exclusiveMinimum: 0
                      unit_price:
                        type: number
                        minimum: 0
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SupplierInvoice'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/supplier-invoices:
    parameters:
    - $ref: '#/components/parameters/Farm'
    get:
      tags:
      - Procurement
      operationId: listSupplierInvoices
      summary: Supplier invoices
      x-permission: procurement.orders.manage | finance.view
      parameters:
      - name: filter[supplier_id]
        in: query
        schema:
          type: string
          format: uuid
      - name: filter[order_id]
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SupplierInvoice'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/ledger/accounts:
    parameters:
    - $ref: '#/components/parameters/Farm'
    get:
      tags:
      - Finance
      operationId: listLedgerAccounts
      summary: Chart of accounts with balances (trial balance)
      x-permission: finance.view
      parameters:
      - name: as_of
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerAccount'
                  meta:
                    type: object
                    properties:
                      total_debit:
                        type: number
                      total_credit:
                        type: number
                      as_of:
                        type:
                        - string
                        - 'null'
                        format: date
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/ledger/entries:
    parameters:
    - $ref: '#/components/parameters/Farm'
    get:
      tags:
      - Finance
      operationId: listLedgerEntries
      summary: Journal entries
      x-permission: finance.view
      parameters:
      - name: filter[source_type]
        in: query
        schema:
          type: string
      - name: filter[source_id]
        in: query
        schema:
          type: string
          format: uuid
      - name: filter[account_id]
        in: query
        schema:
          type: string
          format: uuid
      - name: filter[from]
        in: query
        schema:
          type: string
          format: date
      - name: filter[to]
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Page of results
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/CursorPage'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/LedgerEntry'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/ledger/entries/{entry}:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: entry
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Finance
      operationId: getLedgerEntry
      summary: A journal entry
      x-permission: finance.view
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LedgerEntry'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /farms/{farm}/ledger/entries/{entry}/reverse:
    parameters:
    - $ref: '#/components/parameters/Farm'
    - name: entry
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Finance
      operationId: reverseLedgerEntry
      summary: Reverse an entry
      description: Manual entries only. Entries are never changed or deleted, and a reversal posts the mirror image, at most once (409). An entry posted by a stock movement, delivery or supplier invoice is 409 posted_by_document; correct it through that document (a count or a return).
      x-permission: finance.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 3
                  maxLength: 200
      responses:
        '201':
          description: The reversing entry
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LedgerEntry'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Farm:
      name: farm
      in: path
      required: true
      schema: { type: string, format: uuid }
    Batch:
      name: batch
      in: path
      required: true
      schema: { type: string, format: uuid }
    Dashboard:
      name: dashboard
      in: path
      required: true
      schema: { type: string, enum: [owner, manager, agronomist, livestock, store, accountant, worker] }
    Period:
      name: period
      in: query
      schema: { type: string, enum: [today, 7d, 30d, 90d, ytd, custom], default: 30d }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Required from mobile clients. A repeat returns the first response with the header Idempotent-Replayed: true.'
      schema: { type: string, pattern: '^[A-Za-z0-9\-_]{8,128}$' }

    SubscriptionId:
      name: subscription
      in: path
      required: true
      schema: { type: string, format: uuid }
    Ticket:
      name: ticket
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationToken:
      name: token
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9]{48}$' }
    Catalog:
      name: catalog
      in: path
      required: true
      schema: { type: string, enum: [crops, crop-varieties, animal-species, animal-breeds, units, inventory-categories, activity-types] }

  requestBodies:
    ChangePlan:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [plan_code]
            properties:
              plan_code: { type: string }
    Message:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [body]
            properties:
              body: { type: string, maxLength: 10000 }

  responses:
    Problem:
      description: 'RFC 9457 problem details'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    AdminFarm:
      description: 'Farm metadata'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/AdminFarm' }
    Settings:
      description: 'Settings'
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    label: { type: string }
                    value: {}
                    default: {}
    Integration:
      description: 'Integration provider'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Integration' }
    Plan:
      description: 'Plan'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Plan' }
    PlanList:
      description: 'Plans'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/Plan' } }
    Subscription:
      description: 'Subscription'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Subscription' }
              meta:
                type: object
                properties:
                  payment_id: { type: string, format: uuid }
    CatalogList:
      description: 'Catalogue entries'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/CatalogEntry' } }
    CatalogEntry:
      description: 'Catalogue entry'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/CatalogEntry' }
    Ticket:
      description: 'Support ticket'
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Ticket' }
    TicketPage:
      description: 'Support tickets'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CursorPage'
              - type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Ticket' } }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: Stable machine-readable code (e.g. validation_failed, not_found, mfa_setup_required, token_reuse_detected, append_only)
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        request_id: { type: [string, 'null'] }

    CursorPage:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: [string, 'null'] }
            last: { type: [string, 'null'] }
            prev: { type: [string, 'null'] }
            next: { type: [string, 'null'] }
        meta:
          type: object
          properties:
            path: { type: string }
            per_page: { type: integer }
            next_cursor: { type: [string, 'null'] }
            prev_cursor: { type: [string, 'null'] }

    TokenPair:
      type: object
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_in]
      properties:
        mfa_required: { type: boolean, const: false }
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        expires_in: { type: integer, description: 'seconds' }
        refresh_token: { type: string }
        refresh_expires_in: { type: integer, description: 'seconds' }

    MfaPending:
      type: object
      required: [mfa_required, mfa_token]
      properties:
        mfa_required: { type: boolean, const: true }
        mfa_token: { type: string }
        methods: { type: array, items: { type: string, enum: [totp, recovery_code] } }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: user }
        user_type: { type: string, enum: [platform_admin, member, party] }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: [string, 'null'] }
        mfa_enabled: { type: boolean }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    Device:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: device }
        client: { type: string, enum: [web, mobile] }
        name: { type: [string, 'null'] }
        platform: { type: [string, 'null'] }
        last_ip: { type: [string, 'null'] }
        last_seen_at: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
        created_at: { type: string, format: date-time }

    Scope:
      type: string
      enum: [all, assigned, own]

    Workspace:
      type: object
      required: [type, id, name, dashboards]
      properties:
        type: { type: string, enum: [platform, farm, support, supplier, customer] }
        id: { type: string }
        name: { type: string }
        code: { type: string }
        status: { type: string }
        is_owner: { type: boolean }
        roles:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              name: { type: string }
        permissions:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Scope' }
        dashboards:
          type: array
          items: { type: string, enum: [admin, owner, manager, agronomist, livestock, store, accountant, worker] }
        subscription:
          description: Farm workspaces only
          oneOf:
            - type: 'null'
            - type: object
              properties:
                status: { $ref: '#/components/schemas/SubscriptionStatus' }
                current_period_end: { type: string, format: date }
                grace_until: { type: [string, 'null'], format: date }
                cancel_at_period_end: { type: boolean }
        support_access:
          description: Active owner-granted support access (owners' farm workspaces and support workspaces)
          oneOf:
            - type: 'null'
            - type: object
              properties:
                grant_id: { type: string, format: uuid }
                expires_at: { type: string, format: date-time }

    FarmInput:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        organization_name: { type: string, maxLength: 150 }
        district: { type: [string, 'null'] }
        village: { type: [string, 'null'] }
        country: { type: string, minLength: 2, maxLength: 2 }
        size_ha: { type: [number, 'null'], minimum: 0 }
        timezone: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }

    Farm:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: farm }
        organization_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, active, suspended, closed] }
        district: { type: [string, 'null'] }
        village: { type: [string, 'null'] }
        country: { type: string }
        size_ha: { type: [string, 'null'], description: 'decimal string' }
        timezone: { type: string }
        currency: { type: string }
        approved_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: farm_member }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string }
        status: { type: string, enum: [invited, active, suspended] }
        is_owner: { type: boolean }
        roles:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              key: { type: string }
              name: { type: string }
        joined_at: { type: [string, 'null'], format: date-time }

    Role:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: farm_role }
        key: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        is_system: { type: boolean }
        is_locked: { type: boolean }
        member_count: { type: integer, description: 'Only on the list endpoint' }
        grants:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Scope' }

    PermissionDefinition:
      type: object
      properties:
        key: { type: string }
        module: { type: string }
        description: { type: string }
        scopes: { type: array, items: { $ref: '#/components/schemas/Scope' } }
        owner_only: { type: boolean }
        money: { type: boolean }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: audit_log }
        action: { type: string }
        entity_type: { type: [string, 'null'] }
        entity_id: { type: [string, 'null'] }
        user_id: { type: [string, 'null'] }
        old_values: { type: [object, 'null'] }
        new_values: { type: [object, 'null'] }
        ip: { type: [string, 'null'] }
        request_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Dashboard:
      type: object
      required: [dashboard, generated_at, kpis, widgets, quick_actions, alerts]
      properties:
        dashboard: { type: string }
        farm:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            currency: { type: string }
            timezone: { type: string }
        period:
          type: object
          properties:
            key: { type: string }
            from: { type: string, format: date }
            to: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        kpis:
          type: array
          items: { $ref: '#/components/schemas/Kpi' }
        widgets:
          type: array
          items: { $ref: '#/components/schemas/WidgetRef' }
        quick_actions:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              target: { type: string }
        alerts:
          type: array
          items:
            type: object
            properties:
              severity: { type: string, enum: [low, medium, high] }
              type: { type: string }
              message: { type: string }
              href: { type: string }

    Kpi:
      type: object
      required: [key, label, value, format]
      properties:
        key: { type: string }
        label: { type: string }
        value:
          description: number, money {amount,currency}, quantity {value,unit}, status string, or null
        format: { type: string, enum: [number, money, percent, quantity, duration, status] }
        delta:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                value: { type: [number, 'null'] }
                direction: { type: string, enum: [up, down, flat] }
                vs: { type: string }
        meta: { type: object, description: 'Extra detail, e.g. by_species for livestock.head_count' }

    WidgetRef:
      type: object
      required: [key, type, inline]
      properties:
        key: { type: string }
        type: { type: string, enum: [action_list, checklist, chart, map, timeline] }
        inline: { type: boolean }
        data: { type: object, additionalProperties: true, description: 'Present when inline' }
        href: { type: string, description: 'Present when not inline' }

    ChartWidget:
      type: object
      properties:
        key: { type: string }
        type: { type: string, const: chart }
        chart: { type: string, enum: [bar, line, bar_line] }
        x:
          type: object
          properties:
            type: { type: string }
            values: { type: array, items: { type: string } }
        series:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              unit: { type: string }
              values: { type: array, items: { type: number } }

    BatchKind:
      type: string
      enum: [seed_lot, input_lot, nursery, crop_lot, harvest, animal, animal_product, processed, packaged, shipment]
    BatchStatus:
      type: string
      enum: [open, closed, recalled]
    LinkType:
      type: string
      enum: [derived, split, merge, process, package, ship]

    Quantity:
      type: object
      properties:
        value: { type: string, description: 'decimal string' }
        unit: { type: [string, 'null'] }

    Location:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: [number, 'null'] }

    Batch:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: trace_batch }
        batch_code: { type: string, pattern: '^SFM-[0-9A-Z]{4}-[0-9A-Z]{4}$' }
        kind: { $ref: '#/components/schemas/BatchKind' }
        name: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/BatchStatus' }
        quantity: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        origin_plot_id: { type: [string, 'null'] }
        source:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                type: { type: string }
                id: { type: string }
        version: { type: integer }
        created_by: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TraceEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: trace_event }
        batch_id: { type: string, format: uuid }
        event_type: { type: string }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        recorded_late: { type: boolean, description: 'occurred_at and recorded_at differ by over an hour' }
        actor_user_id: { type: [string, 'null'] }
        worker_id: { type: [string, 'null'] }
        plot_id: { type: [string, 'null'] }
        location: { oneOf: [{ $ref: '#/components/schemas/Location' }, { type: 'null' }] }
        subject:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                type: { type: string }
                id: { type: string }
        payload: { type: object, additionalProperties: true }
        corrects_event_id: { type: [string, 'null'] }
        integrity:
          type: object
          properties:
            seq: { type: integer }
            hash: { type: string }
            prev_hash: { type: string }

    GraphNode:
      type: object
      properties:
        id: { type: string, format: uuid }
        batch_code: { type: string }
        kind: { $ref: '#/components/schemas/BatchKind' }
        name: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/BatchStatus' }
        quantity: { oneOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        depth: { type: integer }

    GraphEdge:
      type: object
      properties:
        id: { type: string, format: uuid }
        from: { type: string, format: uuid }
        to: { type: string, format: uuid }
        link_type: { $ref: '#/components/schemas/LinkType' }
        quantity: { type: [string, 'null'] }
        unit: { type: [string, 'null'] }

    Graph:
      type: object
      properties:
        nodes:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/GraphEdge' }

    PlatformRole:
      type: string
      enum: [super_admin, support, billing]

    Money:
      type: object
      properties:
        amount: { type: string, description: 'decimal string' }
        currency: { type: string }

    AdminFarm:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: admin_farm }
        code: { type: string }
        name: { type: string }
        status: { type: string, enum: [pending, active, suspended, closed] }
        suspension_reason: { type: [string, 'null'] }
        district: { type: [string, 'null'] }
        country: { type: string }
        size_ha: { type: [string, 'null'] }
        organization:
          type: object
          properties:
            id: { type: string }
            name: { type: [string, 'null'] }
        owner:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string }
                name: { type: string }
                email: { type: string }
        member_count: { type: integer }
        subscription:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string }
                status: { $ref: '#/components/schemas/SubscriptionStatus' }
                plan: { type: string }
                current_period_end: { type: string, format: date }
        history:
          type: array
          items:
            type: object
            properties:
              from_status: { type: string }
              to_status: { type: string }
              reason_code: { type: [string, 'null'] }
              note: { type: [string, 'null'] }
              changed_by: { type: [string, 'null'] }
              at: { type: string, format: date-time }
        approved_at: { type: [string, 'null'], format: date-time }
        suspended_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: admin_user }
        name: { type: string }
        email: { type: string }
        user_type: { type: string, enum: [platform_admin, member, party] }
        status: { type: string, enum: [active, disabled] }
        mfa_enabled: { type: boolean }
        platform_roles: { type: array, items: { $ref: '#/components/schemas/PlatformRole' } }
        farm_count: { type: integer }
        last_login_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    IntegrationKind:
      type: string
      enum: [sms, email, maps, weather, payment, push, accounting]

    Integration:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: integration }
        kind: { $ref: '#/components/schemas/IntegrationKind' }
        provider: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
          description: Keys containing key/secret/token/password/credential are masked as ••••last4
        is_enabled: { type: boolean }
        is_default: { type: boolean }
        updated_at: { type: string, format: date-time }

    BackupRun:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [success, failed] }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: string, format: date-time }
        size_bytes: { type: [integer, 'null'] }
        location: { type: [string, 'null'] }
        checksum: { type: [string, 'null'] }
        message: { type: [string, 'null'] }

    PlanInput:
      type: object
      properties:
        code: { type: string, pattern: '^[a-z0-9_]+$', description: 'Create only' }
        name: { type: string }
        description: { type: [string, 'null'] }
        price: { type: number, minimum: 0 }
        currency: { type: string }
        billing_period: { type: string, enum: [monthly, yearly] }
        trial_days: { type: [integer, 'null'] }
        max_farms: { type: [integer, 'null'], description: 'null = unlimited' }
        max_users: { type: [integer, 'null'] }
        max_storage_mb: { type: [integer, 'null'] }
        features: { type: array, items: { type: string } }
        is_active: { type: boolean }
        is_public: { type: boolean }
        sort_order: { type: integer }

    Plan:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: plan }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        billing_period: { type: string, enum: [monthly, yearly] }
        trial_days: { type: [integer, 'null'] }
        limits:
          type: object
          properties:
            farms: { type: [integer, 'null'] }
            users: { type: [integer, 'null'] }
            storage_mb: { type: [integer, 'null'] }
        features: { type: array, items: { type: string } }
        is_active: { type: boolean }
        is_public: { type: boolean }
        sort_order: { type: integer }

    SubscriptionStatus:
      type: string
      enum: [trialing, active, grace, suspended, cancelled]

    UsageItem:
      type: object
      properties:
        used: { type: [integer, 'null'] }
        limit: { type: [integer, 'null'] }

    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: subscription }
        organization:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            owner:
              oneOf:
                - type: 'null'
                - type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    email: { type: string }
        plan: { $ref: '#/components/schemas/Plan' }
        status: { $ref: '#/components/schemas/SubscriptionStatus' }
        current_period_start: { type: string, format: date }
        current_period_end: { type: string, format: date }
        grace_until: { type: [string, 'null'], format: date }
        cancel_at_period_end: { type: boolean }
        cancelled_at: { type: [string, 'null'], format: date-time }
        usage:
          type: object
          properties:
            farms: { $ref: '#/components/schemas/UsageItem' }
            users: { $ref: '#/components/schemas/UsageItem' }
            storage_mb: { $ref: '#/components/schemas/UsageItem' }
        payments:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              provider: { type: string }
              provider_ref: { type: string }
              status: { type: string, enum: [pending, succeeded, failed, refunded] }
              period_start: { type: [string, 'null'], format: date }
              period_end: { type: [string, 'null'], format: date }
              paid_at: { type: [string, 'null'], format: date-time }
              notes: { type: [string, 'null'] }
        history:
          type: array
          items:
            type: object
            properties:
              event: { type: string }
              from_status: { type: [string, 'null'] }
              to_status: { type: string }
              details: { type: [object, 'null'] }
              changed_by: { type: [string, 'null'] }
              at: { type: string, format: date-time }
        version: { type: integer }
        updated_at: { type: string, format: date-time }

    CatalogEntry:
      type: object
      description: 'Common fields plus catalogue-specific ones (scientific_name, category, crop_id, maturity_days, species_id, purpose, dimension, to_base, kind, module)'
      additionalProperties: true
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        code: { type: string }
        name: { type: string }
        is_active: { type: boolean }

    TicketStatus:
      type: string
      enum: [open, pending, resolved, closed]
    TicketPriority:
      type: string
      enum: [low, normal, high, urgent]

    Ticket:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, const: support_ticket }
        reference: { type: string }
        subject: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        organization: { type: object, properties: { id: { type: string }, name: { type: string } } }
        farm:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string }
                name: { type: string }
                code: { type: string }
        opened_by: { type: object, properties: { id: { type: string }, name: { type: string } } }
        assigned_to:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string }
                name: { type: string }
        messages:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              author:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  is_staff: { type: boolean }
              body: { type: string }
              is_internal: { type: boolean }
              created_at: { type: string, format: date-time }
        access_grants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              expires_at: { type: string, format: date-time }
              revoked_at: { type: [string, 'null'], format: date-time }
              active: { type: boolean }
        last_activity_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    GeoJsonPolygon:
      type: object
      description: 'GeoJSON Polygon in WGS 84, [longitude, latitude] positions; closed rings, at most 1000 vertices, no self-intersections.'
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          minItems: 1
          maxItems: 21
          items:
            type: array
            minItems: 4
            items:
              type: array
              minItems: 2
              maxItems: 3
              items: { type: number }

    StructureWarnings:
      type: object
      properties:
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [outside_parent, overlaps_sibling] }
              message: { type: string }
              related:
                type: object
                properties:
                  type: { type: string, enum: [block, section, plot, location] }
                  id: { type: string, format: uuid }
                  code: { type: string }

    StructureBlock:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        type: { type: string, const: farm_block }
        boundary: { oneOf: [{ $ref: '#/components/schemas/GeoJsonPolygon' }, { type: 'null' }] }
