openapi: 3.1.0
info:
  title: SFMTP API
  version: 1.6.0-phase7
  description: |
    Smart Farm Management & Traceability Platform REST API.

    Conventions (docs/06-api-contracts.md): JSON, snake_case, UTC ISO-8601
    timestamps, UUIDv7 ids, cursor pagination, RFC 9457 problem+json errors.
    Every farm route lives under `/farms/{farm}`; a farm you are not an active
    member of is indistinguishable from one that does not exist (404).

    This file is the contract between backend, web and mobile. The backend
    test `OpenApiCoverageTest` fails if a route is missing here.
servers:
  - url: /api/v1
security:
  - bearer: []

tags:
  - name: Auth
    description: Sign-in, token rotation, MFA and password reset.
  - name: Me
    description: The signed-in user, their devices and workspaces.
  - name: Farms
    description: Farm (tenant) profile and lifecycle.
  - name: Access
    description: Members, invitations, roles and the permission registry.
  - name: Workforce
    description: Workers, activities and tasks with their state machine, attendance with GPS and photos, leave, and the field worker's day.
  - name: Media
    description: Photo and document uploads, stored once per farm by SHA-256.
  - name: Sync
    description: Offline push and pull for the mobile app (docs/08).
  - name: Inventory
    description: Items, stores, lots, the stock ledger, issues, transfers, counts with approval, stock requests and alerts. Values need inventory.values.view.
  - name: Procurement
    description: Suppliers, purchase requests, purchase orders with approval, deliveries into stock lots, and supplier invoices matched to what was received.
  - name: Finance
    description: The double-entry ledger (ADR-0011) that stock and purchases post to.
  - name: Livestock
    description: Groups, animals, health and vaccination with withdrawal periods, feeding, weights, production into daily product lots, movements, breeding and sale requests. Records are append-only; mistakes are voided.
  - name: Crops
    description: Farm crop list, seasons, plans, cycles, field operations, observations and harvests. Cycles, operations, observations and harvests write the trace history.
  - name: Structure
    description: Blocks, sections, plots and locations with GeoJSON boundaries (ADR-0009).
  - name: Traceability
    description: Batches, append-only events, links and journeys.
  - name: Dashboards
    description: Server-driven, permission-aware role dashboards.
  - name: Audit
    description: Append-only record of user actions.
  - name: Admin
    description: Platform administration (no farm operational data). Admin operations list the platform capability they need as x-capability.
  - name: Billing
    description: Plans, subscriptions and the owner's billing page.
  - name: Catalog
    description: Global reference catalogues (crops, breeds, units, …).
  - name: Support
    description: Support tickets and owner-granted, read-only support access.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Sign in with email and password
      description: |
        Returns tokens, or `mfa_required: true` with a short-lived `mfa_token`
        to complete with `/auth/mfa/challenge`. Unknown emails, wrong passwords
        and locked accounts all return the same 401 `invalid_credentials`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                client: { type: string, enum: [web, mobile], default: web }
                device:
                  type: object
                  properties:
                    name: { type: string, maxLength: 120 }
                    platform: { type: string, enum: [android, ios, web] }
                    push_token: { type: string }
      responses:
        '200':
          description: Signed in, or second factor required
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: '#/components/schemas/TokenPair'
                      - $ref: '#/components/schemas/MfaPending'
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/mfa/challenge:
    post:
      tags: [Auth]
      operationId: mfaChallenge
      security: []
      summary: Complete sign-in with an authenticator or recovery code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mfa_token]
              properties:
                mfa_token: { type: string }
                code: { type: string, pattern: '^\d{6}$' }
                recovery_code: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      security: []
      summary: Rotate a refresh token
      description: 'Each refresh token works once. Replaying an old one revokes the whole session (`token_reuse_detected`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session (all its tokens)
      responses:
        '204': { description: 'Signed out' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Forgot password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: 'A reset link is emailed if the account exists' }

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Reset password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password, password_confirmation]
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
      responses:
        '204': { description: 'Password changed; every session is signed out' }
        '422': { $ref: '#/components/responses/Problem' }

  /auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: mfaSetup
      summary: Start authenticator-app enrolment
      responses:
        '200':
          description: Secret and otpauth URI for the QR code
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      secret: { type: string }
                      otpauth_uri: { type: string }
        '409': { $ref: '#/components/responses/Problem' }

  /auth/mfa/confirm:
    post:
      tags: [Auth]
      operationId: mfaConfirm
      summary: Mfa confirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: MFA enabled; recovery codes are shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      mfa_enabled: { type: boolean }
                      recovery_codes: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/Problem' }

  /auth/mfa/recovery-codes:
    post:
      tags: [Auth]
      operationId: mfaRegenerateRecoveryCodes
      summary: Mfa regenerate recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: New recovery codes (old ones stop working)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recovery_codes: { type: array, items: { type: string } }
        '422': { $ref: '#/components/responses/Problem' }

  /auth/mfa:
    delete:
      tags: [Auth]
      operationId: mfaDisable
      summary: Turn MFA off (refused when the role requires it)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '204': { description: 'MFA disabled' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Get me
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
                  meta:
                    type: object
                    properties:
                      mfa_required: { type: boolean }
        '401': { $ref: '#/components/responses/Problem' }

  /me/workspaces:
    get:
      tags: [Me]
      operationId: listWorkspaces
      summary: Farms and portals the user can enter, with permissions and dashboards
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
                  meta:
                    type: object
                    properties:
                      default_workspace: { type: [string, 'null'] }
                      mfa_enabled: { type: boolean }
                      mfa_required: { type: boolean }

  /me/devices:
    get:
      tags: [Me]
      operationId: listDevices
      summary: List devices
      responses:
        '200':
          description: Signed-in devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }

  /me/devices/{device}:
    delete:
      tags: [Me]
      operationId: revokeDevice
      summary: Revoke device
      parameters:
        - { name: device, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Device signed out' }
        '404': { $ref: '#/components/responses/Problem' }

  /farms:
    get:
      tags: [Farms]
      operationId: listFarms
      summary: List farms
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Farms the user is an active member of
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Farm' }
    post:
      tags: [Farms]
      operationId: createFarm
      summary: Create a farm (starts `pending` until approved by the platform)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmInput' }
      responses:
        '201':
          description: Farm created; the caller is its owner
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Farm' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /farms/{farm}:
    parameters:
      - $ref: '#/components/parameters/Farm'
    get:
      tags: [Farms]
      operationId: getFarm
      summary: Get farm
      x-permission: farm.profile.view
      responses:
        '200':
          description: Farm profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Farm' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Farms]
      operationId: replaceFarm
      summary: Replace farm
      x-permission: farm.profile.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Farm' }
    patch:
      tags: [Farms]
      operationId: updateFarm
      summary: Update farm
      x-permission: farm.profile.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Farm' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Farms]
      operationId: closeFarm
      x-permission: farm.delete
      summary: Close (archive) the farm. Owner only; data is retained.
      responses:
        '204': { description: 'Closed' }
        '403': { $ref: '#/components/responses/Problem' }

  /me/farms/overview:
    get:
      tags: [Me]
      operationId: myFarmsOverview
      summary: My farms, with the headline numbers the member may see in each
      responses:
        '200':
          description: One card per active membership
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/FarmOverview' }

  /farms/{farm}/settings:
    parameters:
      - $ref: '#/components/parameters/Farm'
    get:
      tags: [Farms]
      operationId: getFarmSettings
      summary: Farm settings
      x-permission: farm.profile.view
      responses:
        '200':
          description: Settings merged over defaults
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FarmSettings' }
    patch:
      tags: [Farms]
      operationId: updateFarmSettings
      summary: Change farm settings (partial)
      x-permission: farm.settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FarmSettingsInput' }
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/FarmSettings' }
        '422': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/members/{member}:
    parameters:
      - $ref: '#/components/parameters/Farm'
      - { name: member, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Access]
      operationId: updateMember
      summary: Change a member's roles or status
      description: 'The owner''s membership and your own cannot be changed (403 guard_rail_owner / guard_rail_self).'
      x-permission: members.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role_ids: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
                status: { type: string, enum: [active, suspended] }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Access]
      operationId: removeMember
      summary: Remove a member from the farm
      x-permission: members.manage
      responses:
        '204': { description: 'Removed' }
        '403': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/invitations:
    parameters:
      - $ref: '#/components/parameters/Farm'
    get:
      tags: [Access]
      operationId: listInvitations
      summary: List invitations (pending by default)
      x-permission: members.view
      parameters:
        - { name: 'filter[status]', in: query, schema: { type: string, enum: [pending, accepted, revoked, expired] } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Invitation' }
    post:
      tags: [Access]
      operationId: createInvitation
      summary: Invite someone by email
      description: |
        Needs `members.manage`, or `members.invite_workers` when every role is a
        field-worker role. The plan's user limit is checked now and again on
        acceptance. The link expires after 7 days.
      x-permission: members.manage | members.invite_workers
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role_ids]
              properties:
                email: { type: string, format: email }
                role_ids: { type: array, minItems: 1, maxItems: 10, items: { type: string, format: uuid } }
                message: { type: [string, 'null'], maxLength: 500 }
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Invitation' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/invitations/{invitation}:
    delete:
      tags: [Access]
      operationId: revokeInvitation
      summary: Withdraw an invitation
      x-permission: members.manage | members.invite_workers
      parameters:
        - $ref: '#/components/parameters/Farm'
        - { name: invitation, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Revoked' }
        '409': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/invitations/{invitation}/resend:
    post:
      tags: [Access]
      operationId: resendInvitation
      summary: Send the invitation again with a fresh link
      x-permission: members.manage | members.invite_workers
      parameters:
        - $ref: '#/components/parameters/Farm'
        - { name: invitation, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Invitation' }
        '409': { $ref: '#/components/responses/Problem' }

  /invitations/{token}:
    get:
      tags: [Access]
      operationId: previewInvitation
      summary: Read an invitation from its emailed link (public)
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: Invitation preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InvitationPreview' }
        '404': { $ref: '#/components/responses/Problem' }

  /invitations/{token}/accept:
    post:
      tags: [Access]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Signed in (bearer optional) with the invited email, or, when no account
        exists for it, with `name` and `password` to create one. 409
        sign_in_required when an account exists; 410 invitation_used /
        invitation_revoked / invitation_expired.
      security: [{}, { bearer: [] }]
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                password: { type: string, minLength: 10 }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Joined with an existing account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InvitationAcceptance' }
        '201':
          description: Account created and joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/InvitationAcceptance' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/members:
    get:
      tags: [Access]
      operationId: listMembers
      summary: List members
      x-permission: members.view
      parameters:
        - $ref: '#/components/parameters/Farm'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Farm members
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }

  /farms/{farm}/roles:
    get:
      tags: [Access]
      operationId: listRoles
      summary: List roles
      x-permission: roles.view
      parameters:
        - $ref: '#/components/parameters/Farm'
      responses:
        '200':
          description: Farm roles with grants
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Role' }

    post:
      tags: [Access]
      operationId: createRole
      summary: Create a custom role
      description: 'Starts empty, from `grants`, or from a copy of another role''s grants (owner-only permissions are never copied).'
      x-permission: roles.manage
      parameters:
        - $ref: '#/components/parameters/Farm'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: [string, 'null'], maxLength: 255 }
                copy_from_role_id: { type: [string, 'null'], format: uuid }
                grants:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/Scope' }
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/Farm'
      - { name: role, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Access]
      operationId: updateRole
      summary: Rename or describe a role
      x-permission: roles.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: [string, 'null'], maxLength: 255 }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Problem' }
    delete:
      tags: [Access]
      operationId: deleteRole
      summary: Delete a custom role nobody holds
      description: '403 system_role for built-in roles; 409 role_in_use while members or pending invitations use it.'
      x-permission: roles.manage
      responses:
        '204': { description: 'Deleted' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /farms/{farm}/roles/{role}/permissions:
    put:
      tags: [Access]
      operationId: updateRolePermissions
      x-permission: roles.manage
      summary: Replace a role's grants (guard-rails apply, docs/04 §4)
      parameters:
        - $ref: '#/components/parameters/Farm'
