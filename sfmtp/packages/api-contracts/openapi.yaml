              properties:
                hours: { type: integer, minimum: 1, maximum: 72 }
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      type: { type: string, const: support_access_grant }
                      farm_id: { type: string, format: uuid }
                      expires_at: { type: string, format: date-time }
                      active: { type: boolean }
