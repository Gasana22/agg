    get:
      tags: [Support]
      operationId: getMyTicket
      summary: A ticket and its public conversation
      parameters: [{ $ref: '#/components/parameters/Ticket' }]
      responses:
        '200': { $ref: '#/components/responses/Ticket' }
        '404': { $ref: '#/components/responses/Problem' }

