    put:
      tags: [Admin]
      operationId: adminUpdateSettings
      summary: Update platform settings (validated per key)
      x-capability: settings.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/integrations:
    get:
