      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CursorPage'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/Subscription' } }

  /admin/subscriptions/{subscription}:
    get:
      tags: [Billing]
      operationId: adminGetSubscription
      summary: Subscription with usage, payments and history
      x-capability: subscriptions.view
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      responses:
        '200': { $ref: '#/components/responses/Subscription' }

  /admin/subscriptions/{subscription}/payments:
    post:
      tags: [Billing]
      operationId: adminRecordPayment
      summary: Record a manual payment (a successful one starts or extends a paid period)
      x-capability: subscriptions.manage
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, provider, provider_ref]
              properties:
                amount: { type: number, minimum: 0 }
                currency: { type: string, minLength: 3, maxLength: 3 }
                provider: { type: string, enum: [manual, bank_transfer, mobile_money, cash] }
                provider_ref: { type: string, maxLength: 120 }
                status: { type: string, enum: [succeeded, failed], default: succeeded }
                paid_at: { type: string, format: date-time }
                notes: { type: string, maxLength: 500 }
      responses:
        '201': { $ref: '#/components/responses/Subscription' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/subscriptions/{subscription}/change-plan:
    post:
      tags: [Billing]
      operationId: adminChangePlan
      summary: Move a subscription to another plan (any active plan)
      x-capability: subscriptions.manage
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      requestBody: { $ref: '#/components/requestBodies/ChangePlan' }
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/subscriptions/{subscription}/cancel:
    post:
      tags: [Billing]
      operationId: adminCancelSubscription
      summary: Cancel now or at the end of the period
      x-capability: subscriptions.manage
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [at_period_end, reason]
              properties:
                at_period_end: { type: boolean }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '409': { $ref: '#/components/responses/Problem' }

  /admin/subscriptions/{subscription}/extend:
    post:
      tags: [Billing]
      operationId: adminExtendSubscription
      summary: Extend a trial or paid period by N days
      x-capability: subscriptions.manage
      parameters: [{ $ref: '#/components/parameters/SubscriptionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days, reason]
              properties:
                days: { type: integer, minimum: 1, maximum: 90 }
                reason: { type: string, maxLength: 500 }
      responses:
        '200': { $ref: '#/components/responses/Subscription' }
        '409': { $ref: '#/components/responses/Problem' }

  /billing/plans:
    get:
      tags: [Billing]
      operationId: listPublicPlans
