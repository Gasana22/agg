      x-capability: plans.manage
      parameters:
        - { name: plan, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanInput' }
      responses:
        '200': { $ref: '#/components/responses/Plan' }
        '422': { $ref: '#/components/responses/Problem' }

  /admin/subscriptions:
    get:
