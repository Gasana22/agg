    post:
      tags: [Support]
      operationId: replyToMyTicket
      summary: Reply (re-opens the ticket)
      parameters: [{ $ref: '#/components/parameters/Ticket' }]
      requestBody: { $ref: '#/components/requestBodies/Message' }
